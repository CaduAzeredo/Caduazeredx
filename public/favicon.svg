<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cadu Azeredo">
  <title>Cadu Azeredo</title>
  <!-- A marca compacta: o prompt é a moldura, a barra fecha na raiz.
       Mesma construção do lockup completo, sem o nome. -->
  <rect width="64" height="64" rx="13" fill="#0A0E10"/>
  <rect x="6.5" y="6.5" width="51" height="51" rx="10" fill="none" stroke="#3FA372" stroke-width="3"/>
  <g stroke="#3FA372" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- o chevron do prompt -->
    <path d="M20 23.5 L28.5 32 L20 40.5"/>
    <!-- o cursor -->
    <path d="M33 42.5 H44"/>
  </g>
</svg>
